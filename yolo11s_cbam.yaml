# YOLOv11s + CBAM — Exp B (PCB Defect Detection)
# ─────────────────────────────────────────────────────────────────────────────
# Architecture: 3 CBAM modules inserted AFTER C3k2 at P3/P4/P5 scales.
# FPN skip connections use CBAM-refined outputs (not raw conv outputs).
# No P2 head — same detection heads as Exp A.
#
# ch-index reference — parse_model resets ch at i=0, so ch[k] = output of layer k directly:
#   ch[ 5] = L5  CBAM@P3  = 256ch  ← P3 FPN skip  (from=5)
#   ch[ 8] = L8  CBAM@P4  = 256ch  ← P4 FPN skip  (from=8)
#   ch[13] = L13 C2PSA    = 512ch  ← backbone top (from=13)
#   ch[16] = L16 C3k2     = 256ch  ← head P4 for bottom-up path (from=16)
#
# Backbone layers (14 total, 0-indexed 0–13):
#   0  Conv        P1/2       ch[0]=32
#   1  Conv        P2/4       ch[1]=64
#   2  C3k2                   ch[2]=128
#   3  Conv        P3/8       ch[3]=128
#   4  C3k2        P3-feat    ch[4]=256
#   5  CBAM        P3-attn    ch[5]=256  ← FPN skip (from=5)
#   6  Conv        P4/16      ch[6]=256
#   7  C3k2        P4-feat    ch[7]=256
#   8  CBAM        P4-attn    ch[8]=256  ← FPN skip (from=8)
#   9  Conv        P5/32      ch[9]=512
#  10  C3k2        P5-feat    ch[10]=512
#  11  CBAM        P5-attn    ch[11]=512
#  12  SPPF                   ch[12]=512
#  13  C2PSA                  ch[13]=512 ← backbone top (from=13)
# ─────────────────────────────────────────────────────────────────────────────

nc: 6  # PCB defect classes

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00,  512]
  l: [1.00, 1.00,  512]
  x: [1.00, 1.50,  512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]]            # 0   P1/2
  - [-1, 1, Conv,  [128, 3, 2]]           # 1   P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]    # 2
  - [-1, 1, Conv,  [256, 3, 2]]           # 3   P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]    # 4   P3 features
  - [-1, 1, CBAM,  [512]]                 # 5   CBAM @ P3  → ch[6]=256
  - [-1, 1, Conv,  [512, 3, 2]]           # 6   P4/16
  - [-1, 2, C3k2,  [512, True]]           # 7   P4 features
  - [-1, 1, CBAM,  [512]]                 # 8   CBAM @ P4  → ch[9]=256
  - [-1, 1, Conv,  [1024, 3, 2]]          # 9   P5/32
  - [-1, 2, C3k2,  [1024, True]]          # 10  P5 features
  - [-1, 1, CBAM,  [1024]]               # 11  CBAM @ P5  → ch[12]=512
  - [-1, 1, SPPF,  [1024, 5]]            # 12              ch[13]=512
  - [-1, 2, C2PSA, [1024]]               # 13              ch[14]=512

head:
  # ── Top-down path ──────────────────────────────────────────────────────────
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14  upsample C2PSA  ch[14]=512
  - [[-1, 8], 1, Concat,  [1]]                   # 15  + CBAM@P4 skip  ch[15]=768
  - [-1, 2, C3k2, [512, False]]                  # 16  FPN@P4          ch[16]=256

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 17  upsample FPN@P4 ch[17]=256
  - [[-1, 5], 1, Concat,  [1]]                   # 18  + CBAM@P3 skip  ch[18]=512
  - [-1, 2, C3k2, [256, False]]                  # 19  P3/8-small      ch[19]=128

  # ── Bottom-up path ─────────────────────────────────────────────────────────
  - [-1, 1, Conv, [256, 3, 2]]                   # 20  downsample      ch[20]=128
  - [[-1, 16], 1, Concat, [1]]                   # 21  + FPN@P4 C3k2  ch[21]=384
  - [-1, 2, C3k2, [512, False]]                  # 22  P4/16-medium    ch[22]=256

  - [-1, 1, Conv, [512, 3, 2]]                   # 23  downsample      ch[23]=256
  - [[-1, 13], 1, Concat, [1]]                   # 24  + C2PSA         ch[24]=768
  - [-1, 2, C3k2, [1024, True]]                  # 25  P5/32-large     ch[25]=512

  - [[19, 22, 25], 1, Detect, [nc]]              # 26  Detect(P3,P4,P5)
